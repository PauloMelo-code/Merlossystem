<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sem internet — Merlos Store</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #171717;
        color: #fafafa;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
        padding: 24px;
      }
      p { color: #a3a3a3; line-height: 1.5; max-width: 34ch; }
      button {
        margin-top: 20px;
        padding: 12px 20px;
        font-size: 16px;
        border: 0;
        border-radius: 10px;
        background: #fafafa;
        color: #171717;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div>
      <img src="/icones/icone-192.png" alt="" width="72" height="72" style="border-radius: 16px" />
      <h1>Sem internet</h1>
      <p>
        O atendimento precisa de conexão para mostrar as conversas do momento. Assim que
        a internet voltar, toque em tentar de novo.
      </p>
      <button onclick="location.reload()">Tentar de novo</button>
    </div>
  </body>
</html>
