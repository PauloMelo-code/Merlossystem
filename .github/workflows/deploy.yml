# CI/CD — MerlostoreChat
#
#   push/PR em qualquer branch -> job `verificar` (os 12 passos de 03-arquitetura §19)
#   push em `develop`          -> verificar -> deploy HML
#   push em `master`           -> verificar -> BACKUP obrigatorio -> deploy PRD
#
# Por que o auditor roda aqui: os hooks de `.claude/hooks/` so existem dentro do Claude
# Code. Codex, Antigravity, qualquer pessoa da equipe e qualquer commit vindo de fora
# passam por baixo deles. O CI e a unica barreira comum — por isso `compliance`,
# `test:compliance`, `docs:check` e `ai-marks` sao passos daqui, nao so do hook.
#
# O worker e publicado JUNTO com o app: sem ele o sistema sobe sem quem processe a fila.
#
# Secrets por Environment (`hml` e `prd`):
#   <AMB>_DATABASE_URL_MIGRACAO   papel merlo_migracao — migracao e backup
#   <AMB>_DEPLOY_APP              gatilho de deploy do app
#   <AMB>_DEPLOY_WORKER           gatilho de deploy do worker
#   <AMB>_APP_URL                 alvo da fumaca de seguranca
#   <AMB>_SONDA_SEGREDO           header x-merlo-sonda de /api/pronto
#   PRD_BACKUP_DEST               destino do backup FORA do servidor do banco

name: CI/CD

on:
  push:
    branches: [develop, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24"

jobs:
  # ---------------------------------------------------------------------------
  # verificar — roda em TODO push e TODA PR. 12 passos, nesta ordem.
  # As travas de fonte vem antes de subir servico: e o retorno mais rapido.
  # ---------------------------------------------------------------------------
  verificar:
    name: Verificar (12 passos)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: merlostore_test
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: dev
        ports: ["5437:5432"]
        options: >-
          --health-cmd "pg_isready -U dev"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6382:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgres://dev:dev@localhost:5437/merlostore_test
      DATABASE_URL_MIGRACAO: postgres://dev:dev@localhost:5437/merlostore_test
      DATABASE_URL_TESTE: postgres://dev:dev@localhost:5437/merlostore_test
      REDIS_URL: redis://localhost:6382

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # o gitleaks precisa do historico

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # `src/lib/env.ts` cobra o ambiente INTEIRO no boot, e `next build` roda com
      # NODE_ENV=production, que ainda exige EMAIL_* e SONDA_SEGREDO. Os segredos
      # sao gerados na hora: valor literal aqui viraria achado do gitleaks e, pior,
      # um segredo de teste que alguem copia para producao.
      - name: Ambiente de teste (segredos gerados na hora)
        run: |
          {
            echo "APP_URL=http://localhost:3005"
            echo "BETTER_AUTH_SECRETS=v1:$(openssl rand -hex 24)"
            echo "AUTH_EMAIL_HASH_KEY=$(openssl rand -hex 24)"
            echo "INTEGRATIONS_KEY=$(openssl rand -hex 24)"
            echo "INTEGRATIONS_STATE_KEY=$(openssl rand -hex 24)"
            echo "SONDA_SEGREDO=$(openssl rand -hex 24)"
            echo "S3_ENDPOINT=http://localhost:9002"
            echo "S3_BUCKET=merlostore-midia"
            echo "S3_ACCESS_KEY=ci"
            echo "S3_SECRET_KEY=ci-sem-valor"
            echo "S3_REGION=us-east-1"
            echo "EMAIL_PROVEDOR=nenhum"
            echo "EMAIL_REMETENTE=seguranca@exemplo.invalido"
            echo "EMAIL_API_KEY=ci-sem-valor"
            echo "AUTH_HIBP_HABILITADO=false"
          } >> "$GITHUB_ENV"

      - name: 1. Lint
        run: npm run lint

      - name: 2. Type check
        run: npm run typecheck

      - name: 3. Auditor de conformidade
        run: npm run compliance

      - name: 4. Trava do auditor
        run: npm run test:compliance

      - name: 5. Travas de fonte
        run: npm run test:travas

      - name: 6. Testes de unidade
        run: npm run test:unidade

      - name: 7. Testes de componentes
        run: npm run test:componentes

      - name: 8. Banco de teste, migracoes e conferencia de schema
        run: |
          node scripts/db-teste.mjs
          npm run db:migrate
          npm run db:verificar

      - name: 9. Testes de integracao e seguranca
        run: npm run test:integracao

      - name: 10. Drift de documentacao e marcas de IA
        run: |
          node scripts/docs-check.mjs --strict
          npm run ai-marks

      - name: 11. Build
        run: npm run build

      - name: 12a. Vulnerabilidades de dependencia
        run: npm audit --omit=dev --audit-level=high

      - name: 12b. Segredos no historico
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # HML — branch develop
  # ---------------------------------------------------------------------------
  hml:
    name: Deploy HML
    needs: verificar
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: hml
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Migrar o banco de HML
        env:
          DATABASE_URL_MIGRACAO: ${{ secrets.HML_DATABASE_URL_MIGRACAO }}
        run: npm run db:migrate

      - name: Publicar app e worker
        env:
          APP: ${{ secrets.HML_DEPLOY_APP }}
          WORKER: ${{ secrets.HML_DEPLOY_WORKER }}
        run: |
          if [ -z "$APP" ] || [ -z "$WORKER" ]; then
            echo "::error::HML_DEPLOY_APP e HML_DEPLOY_WORKER sao obrigatorios."
            echo "O worker sobe JUNTO com o app; sem ele a fila nao e processada."
            exit 1
          fi
          curl -fsS -X POST "$APP"
          curl -fsS -X POST "$WORKER"

      - name: Fumaca de seguranca
        env:
          ALVO: ${{ secrets.HML_APP_URL }}
          SONDA_SEGREDO: ${{ secrets.HML_SONDA_SEGREDO }}
        run: node scripts/fumaca-seguranca.mjs --alvo "$ALVO"

  # ---------------------------------------------------------------------------
  # PRD — branch master. O backup e passo OBRIGATORIO: falhou, aborta.
  # ---------------------------------------------------------------------------
  prd:
    name: Deploy PRD
    needs: verificar
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: prd
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # A regra de DR nao aceita backup que fica no mesmo servidor do banco.
      # O dump tambem nao vira artifact do Actions: qualquer pessoa com leitura no
      # repositorio baixaria nome, telefone e valor de venda de cliente real.
      - name: Exigir destino de backup fora do servidor do banco
        env:
          DEST: ${{ secrets.PRD_BACKUP_DEST }}
        run: |
          if [ -z "$DEST" ]; then
            echo "::error::PRD_BACKUP_DEST nao configurado. Deploy em producao abortado."
            exit 1
          fi

      - name: Backup do banco (obrigatorio, aborta o deploy se falhar)
        env:
          DATABASE_URL_MIGRACAO: ${{ secrets.PRD_DATABASE_URL_MIGRACAO }}
          BACKUP_DEST: ${{ secrets.PRD_BACKUP_DEST }}
        run: npm run db:backup

      - name: Migrar o banco de PRD
        env:
          DATABASE_URL_MIGRACAO: ${{ secrets.PRD_DATABASE_URL_MIGRACAO }}
        run: npm run db:migrate

      - name: Publicar app e worker
        env:
          APP: ${{ secrets.PRD_DEPLOY_APP }}
          WORKER: ${{ secrets.PRD_DEPLOY_WORKER }}
        run: |
          if [ -z "$APP" ] || [ -z "$WORKER" ]; then
            echo "::error::PRD_DEPLOY_APP e PRD_DEPLOY_WORKER sao obrigatorios."
            exit 1
          fi
          curl -fsS -X POST "$APP"
          curl -fsS -X POST "$WORKER"

      - name: Fumaca de seguranca
        env:
          ALVO: ${{ secrets.PRD_APP_URL }}
          SONDA_SEGREDO: ${{ secrets.PRD_SONDA_SEGREDO }}
        run: node scripts/fumaca-seguranca.mjs --alvo "$ALVO"

      - name: Marcar a versao publicada
        run: |
          git tag "prd-$(date +%Y%m%d-%H%M)"
          git push origin --tags
